[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aw-m17-diag"
version = "0.1.0"
description = "Hardware diagnostic, crash forensics, workload tuning, and custom driver advisory suite for Alienware m17 (0DG9D5)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "maxx" }]
dependencies = [
    "psutil>=6.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
aw-m17-diag = "aw_m17_diag.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aw_m17_diag"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations
    "RUF",    # Ruff-specific rules
    "PT",     # flake8-pytest-style
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = true
reportUnknownVariableType = true
reportUnknownArgumentType = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
